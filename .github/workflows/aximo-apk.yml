name: Build Aximo APK

on:
  workflow_dispatch:
  push:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload Aximo APK
        uses: actions/upload-artifact@v4
        with:
          name: Aximo-debug-apk
          path: "app/build/outputs/apk/unofficial/debug/app-unofficial-debug.apk"
          if-no-files-found: error
