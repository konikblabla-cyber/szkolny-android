name: Build Aximo APK

on:
  workflow_dispatch:
  push:
    branches: ["feature/modern-diary-ui"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout restored Aximo branch
        uses: actions/checkout@v4
        with:
          ref: feature/modern-diary-ui

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleUnofficialDebug --stacktrace --no-daemon

      - name: Upload Aximo APK
        uses: actions/upload-artifact@v4
        with:
          name: Aximo-debug-apk
          path: "app/build/outputs/apk/unofficial/debug/app-unofficial-debug.apk"
          if-no-files-found: error

# Trigger Aximo APK build
# Manual rebuild requested
